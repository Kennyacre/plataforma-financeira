<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Completar Cadastro | MTConnect</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
    
    <style>
        :root {
            --bg-dark: #09090b;
            --card-bg: #18181b;
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at center, rgba(255,255,255,0.03) 0%, transparent 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
        }

        .login-box {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .logo-img {
            width: 80px;
            height: 80px;
            border-radius: 16px;
            object-fit: cover;
            border: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 20px;
        }

        h2 { font-family: 'Outfit', sans-serif; font-size: 24px; font-weight: 700; margin-bottom: 10px; }
        .subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 30px; line-height: 1.5; }

        .form-group { text-align: left; margin-bottom: 24px; }
        .form-group label { display: block; margin-bottom: 10px; color: var(--text-muted); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }

        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-wrapper .material-symbols-rounded { position: absolute; left: 14px; color: var(--text-muted); font-size: 20px; }

        .form-control {
            width: 100%;
            padding: 14px 14px 14px 46px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: #09090b;
            color: white;
            font-size: 15px;
            transition: all 0.3s ease;
        }
        .form-control:focus { outline: none; border-color: rgba(255, 255, 255, 0.5); background: #000000; }

        .btn-primary {
            width: 100%;
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 12px;
        }
        .btn-primary:hover { background: #e4e4e7; transform: translateY(-2px); }

        .btn-secondary {
            width: 100%;
            background: transparent;
            color: var(--text-muted);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-secondary:hover { background: rgba(255,255,255,0.05); color: #fff; }
    </style>
</head>

<body>
    <div class="login-box">
        <img src="assets/img/logo.jpg" alt="TN INFO" class="logo-img">
        <h2>Bem-vindo, <span id="nomeUser"></span>!</h2>
        <div class="subtitle">Sua conta Google foi verificada. Falta apenas um passo para criar seu perfil:</div>

        <form id="formCompletar">
            <div class="form-group">
                <label>Código de Indicação</label>
                <div class="input-wrapper">
                    <span class="material-symbols-rounded">group</span>
                    <input type="text" id="codigo" class="form-control" placeholder="ID do Revendedor (Opcional)">
                </div>
            </div>

            <button type="submit" class="btn-primary" id="btnSalvar">Finalizar Cadastro</button>
            <button type="button" class="btn-secondary" onclick="pularIndicacao()">Não tenho código, pular</button>
        </form>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const email = urlParams.get('email');
        const nome = urlParams.get('name');
        const google_id = urlParams.get('gid');

        if(nome) document.getElementById('nomeUser').innerText = nome.split(' ')[0];

        async function enviarDados(codigo) {
            const btn = document.getElementById('btnSalvar');
            btn.disabled = true;
            btn.innerText = 'Processando...';

            try {
                const res = await fetch('/api/auth/google/completar', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        email: email,
                        nome: nome,
                        google_id: google_id,
                        codigo_indicacao: codigo
                    })
                });
                
                const data = await res.json();
                if(res.ok && data.status === 'sucesso') {
                    // Loga o usuário automaticamente
                    localStorage.setItem('usuarioLogado', data.username);
                    localStorage.setItem('funcaoUsuario', data.role);
                    window.location.href = '/cliente/painel-cliente.html';
                } else {
                    alert(data.detail || 'Erro ao processar');
                    btn.disabled = false;
                    btn.innerText = 'Finalizar Cadastro';
                }
            } catch(e) {
                alert("Erro de conexão");
                btn.disabled = false;
                btn.innerText = 'Finalizar Cadastro';
            }
        }

        document.getElementById('formCompletar').addEventListener('submit', function(e) {
            e.preventDefault();
            const codigo = document.getElementById('codigo').value;
            enviarDados(codigo);
        });

        function pularIndicacao() {
            enviarDados("");
        }
    </script>
</body>
</html>
