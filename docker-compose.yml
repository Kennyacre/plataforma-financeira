version: '3.8'

services:
  db_postgres:
    image: postgres:15-alpine
    container_name: db_postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  mtconnect_app:
    build: .
    container_name: mtconnect_app
    restart: unless-stopped
    env_file: .env
    depends_on:
      - db_postgres
    volumes:
      - .:/app
    ports:
      - "8501:8251"
    command: gunicorn main:app -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8251


